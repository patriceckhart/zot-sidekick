name: Build macOS DMG

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    env:
      SCHEME: "zot sidekick"
      APP_NAME: "zot sidekick"
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Icon Composer (.icon) requires Xcode 26 or newer; pin to latest
          # so actool understands the Icon.icon bundle on CI.
          xcode-version: latest

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          # Auto-increment per build from the run number, with rollover:
          #   0.0.1 .. 0.0.99, then 0.1.0 .. 0.1.99, then 0.2.0 ...
          #   ... 0.99.99, then 1.0.0, 1.0.1, ...
          # 100 patch values (0..99) per minor, 100 minors per major.
          # Run numbers start at 1, so the first build is 0.0.1.
          N=${GITHUB_RUN_NUMBER}
          MAJOR=$((N / 10000))
          REM=$((N % 10000))
          MINOR=$((REM / 100))
          PATCH=$((REM % 100))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Computed version: $VERSION (run #$N)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "zot sidekick.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Locate built .app
        id: app
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/$CONFIGURATION -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found" >&2
            exit 1
          fi
          echo "Found: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Install Liquid Glass icon (prebuilt Assets.car)
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.app_path }}"
          RES="$APP_PATH/Contents/Resources"
          PLIST="$APP_PATH/Contents/Info.plist"

          # The Liquid Glass .icon is compiled on a Mac with the right Xcode
          # (see prebuilt-icon/, produced by scripts/compile-icon.sh). The CI
          # runner's actool can crash on .icon, so we inject the prebuilt
          # asset catalog instead of recompiling it here.
          if [ -f prebuilt-icon/Assets.car ]; then
            cp prebuilt-icon/Assets.car "$RES/Assets.car"
            [ -f prebuilt-icon/Icon.icns ] && cp prebuilt-icon/Icon.icns "$RES/Icon.icns"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIconName Icon" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string Icon" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile Icon" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string Icon" "$PLIST"
            echo "Installed Liquid Glass icon from prebuilt-icon/Assets.car"
          else
            echo "prebuilt-icon/Assets.car not found; keeping the classic AppIcon." >&2
          fi

      - name: Ad-hoc sign (so Gatekeeper does not flag a broken signature)
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.app_path }}"
          # Deep ad-hoc sign, including the embedded zot binary.
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --verbose=2 "$APP_PATH" || true

      - name: Create DMG with Applications symlink
        id: dmg
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.app_path }}"
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="Zot-Sidekick-${VERSION}.dmg"

          STAGING="dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          # Copy the app and add a drag-and-drop /Applications symlink.
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          # Build a compressed DMG from the staging folder.
          hdiutil create \
            -volname "Zot Sidekick" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zot-Sidekick-DMG
          path: ${{ steps.dmg.outputs.dmg_name }}
          if-no-files-found: error

      # Publish a versioned GitHub Release on every push to the default branch,
      # and keep it marked as the latest release.
      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          make_latest: true
          files: ${{ steps.dmg.outputs.dmg_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
