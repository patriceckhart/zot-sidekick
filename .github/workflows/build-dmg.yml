name: Build macOS DMG

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    env:
      SCHEME: "zot sidekick"
      APP_NAME: "zot sidekick"
      CONFIGURATION: Release
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Icon Composer (.icon) requires Xcode 26 or newer; pin to latest
          # so actool understands the Icon.icon bundle on CI.
          xcode-version: latest

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          # Auto-increment per build from the run number, with rollover:
          #   0.0.1 .. 0.0.99, then 0.1.0 .. 0.1.99, then 0.2.0 ...
          #   ... 0.99.99, then 1.0.0, 1.0.1, ...
          # 100 patch values (0..99) per minor, 100 minors per major.
          # Run numbers start at 1, so the first build is 0.0.1.
          N=${GITHUB_RUN_NUMBER}
          MAJOR=$((N / 10000))
          REM=$((N % 10000))
          MINOR=$((REM / 100))
          PATCH=$((REM % 100))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Computed version: $VERSION (run #$N)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "zot sidekick.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Locate built .app
        id: app
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/$CONFIGURATION -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found" >&2
            exit 1
          fi
          echo "Found: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Install Liquid Glass icon (prebuilt Assets.car)
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.app_path }}"
          RES="$APP_PATH/Contents/Resources"
          PLIST="$APP_PATH/Contents/Info.plist"

          # The Liquid Glass .icon is compiled on a Mac with the right Xcode
          # (see prebuilt-icon/, produced by scripts/compile-icon.sh). The CI
          # runner's actool can crash on .icon, so we inject the prebuilt
          # asset catalog instead of recompiling it here.
          if [ -f prebuilt-icon/Assets.car ]; then
            cp prebuilt-icon/Assets.car "$RES/Assets.car"
            [ -f prebuilt-icon/Icon.icns ] && cp prebuilt-icon/Icon.icns "$RES/Icon.icns"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIconName Icon" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string Icon" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile Icon" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string Icon" "$PLIST"
            echo "Installed Liquid Glass icon from prebuilt-icon/Assets.car"
          else
            echo "prebuilt-icon/Assets.car not found; keeping the classic AppIcon." >&2
          fi

      # Import a Developer ID Application certificate (if provided as secrets)
      # into a temporary keychain so the app can be signed with a STABLE
      # identity. A stable signature is what lets macOS remember the
      # Accessibility (TCC) grant across updates, which is required for the
      # global hotkey and the synthetic Cmd+V "Paste into" to work after
      # installing a downloaded build.
      - name: Import signing certificate
        id: cert
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "Signing identity: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign app
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.app_path }}"
          if [ -n "${IDENTITY:-}" ]; then
            echo "Signing with Developer ID: $IDENTITY"
            # Sign inner binaries first (e.g. the embedded zot CLI), then the
            # app bundle, with hardened runtime so the build can be notarized.
            find "$APP_PATH/Contents" -type f \( -name "*.dylib" -o -perm -u+x \) -print0 2>/dev/null \
              | while IFS= read -r -d '' f; do
                  if file "$f" | grep -q "Mach-O"; then
                    codesign --force --options runtime --timestamp --sign "$IDENTITY" "$f" || true
                  fi
                done
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          else
            echo "No Developer ID secret set; falling back to ad-hoc signature."
            echo "WARNING: ad-hoc builds re-prompt for Accessibility on every launch" >&2
            echo "and cannot send synthetic keystrokes. Set MACOS_CERT_P12 to fix." >&2
            codesign --force --deep --sign - "$APP_PATH"
          fi

      - name: Create DMG with Applications symlink
        id: dmg
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.app_path }}"
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="zot-sidekick-${VERSION}.dmg"

          STAGING="dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          # Copy the app and add a drag-and-drop /Applications symlink.
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          # Build a compressed DMG from the staging folder.
          hdiutil create \
            -volname "zot sidekick" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Notarize and staple the DMG so Gatekeeper accepts it without a
      # right-click "Open" dance. Requires an App Store Connect API key
      # (or Apple ID) provided as secrets. Skipped when not configured.
      - name: Notarize DMG
        if: env.MACOS_CERT_P12 != '' && env.NOTARY_APPLE_ID != ''
        env:
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="${{ steps.dmg.outputs.dmg_name }}"
          xcrun notarytool submit "$DMG" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: zot-sidekick-dmg
          path: ${{ steps.dmg.outputs.dmg_name }}
          if-no-files-found: error

      # Publish a versioned GitHub Release on every push to the default branch,
      # and keep it marked as the latest release.
      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          make_latest: true
          files: ${{ steps.dmg.outputs.dmg_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
